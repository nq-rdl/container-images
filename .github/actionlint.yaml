---
# actionlint configuration.
# Docs: https://github.com/rhysd/actionlint/blob/main/docs/config.md
# Run locally: actionlint
paths:
  # Glob (not a literal path) so the ignore applies however actionlint is
  # invoked: bare from the repo root, or with a relative/absolute file path.
  "**/release-finalize.yml":
    ignore:
      # `concurrency.queue` shipped in GitHub Actions on 2026-05-07 (up to 100
      # pending runs per group). actionlint's schema has not caught up as of
      # v1.7.12 and reports the key as unexpected; GitHub itself validates and
      # honours it. Drop this entry once actionlint recognises the key.
      - 'unexpected key "queue" for "concurrency" section'
