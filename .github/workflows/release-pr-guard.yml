name: Release — PR guard

# Pre-merge companion to release-finalize.yml's post-merge monotonic backstop.
# Runs only on `release/v*` PRs (skipped otherwise) and fails when the PR is
# stale — its version not strictly greater than the base branch's VERSION.
# This catches the two-open-release-PRs case at merge time: if the newer
# version merges first, the older PR goes red on its next synchronize instead
# of landing a downgraded VERSION on main.
#
# Base-branch moves alone do NOT re-trigger PR checks — to make this guard
# binding, mark it as a required status check and enable "require branches to
# be up to date before merging" (see docs/releasing.md).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  version-monotonic:
    # Release PRs are always same-repo branches opened by release-prepare.yml.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head (not the default merge ref: a stale release PR
      # usually conflicts with main on VERSION/CHANGELOG, in which case the
      # merge ref does not exist and a default checkout would fail).
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify release PR version is consistent and monotonic
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release/v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not derive X.Y.Z from head ref '$HEAD_REF'"; exit 1
          fi

          # The PR content must match the branch name — the same consistency
          # checks release-finalize.yml re-asserts post-merge, surfaced here
          # where they are still cheap to fix.
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "::error::VERSION ($file_version) != branch version ($version)"; exit 1
          fi
          if [ ! -f ".changes/$version.md" ]; then
            echo "::error::.changes/$version.md missing from the release branch"; exit 1
          fi

          # Stale-PR guard: the release version must be strictly greater than
          # the base branch's current VERSION (semver-aware via GNU sort -V).
          git fetch --depth 1 origin "refs/heads/$BASE_REF"
          base_version="$(git show FETCH_HEAD:VERSION | tr -d '[:space:]')"
          if [ "$version" = "$base_version" ]; then
            echo "::error::release version $version equals $BASE_REF's VERSION — stale release PR."; exit 1
          fi
          highest="$(printf '%s\n%s\n' "$version" "$base_version" | sort -V | tail -n1)"
          if [ "$highest" != "$version" ]; then
            echo "::error::release version $version is not greater than $BASE_REF's VERSION ($base_version) — stale release PR. Close it and re-dispatch 'Release — Prepare PR' with a higher version."
            exit 1
          fi
          echo "release PR v$version is consistent and newer than $BASE_REF (v$base_version)."
